name: CI

on:
  pull_request: 
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}   # ensures conda is activated for all steps

    steps:
      - uses: actions/checkout@v5

      - name: Start postgres+postgis docker container
        run: docker compose -f docker/docker-compose.yml up -d --wait

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: 035_phenobase
          cache-environment: true

      # static type checking
      - name: mypy
        run: mypy .

      # lint + complexity + security (replaces pylint, bandit, radon cc)
      - name: ruff check
        run: ruff check

      # formatting check (replaces autopep8)
      - name: ruff format
        run: ruff format --check
      
      # Load minimal env vars for pytest to run (only test credentatial)
      - name: Get Env Vars
        run: |
          cp .env.template .env

      # Test Coverage excluding  test that only run on FOLA infrastructure
      - name: pytest with coverage
        run: pytest --cov=src/ --cov-fail-under=80 -m "not ags_fola"
