name: CI

on:
  pull_request: 
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash -l {0}   # ensures conda is activated for all steps

    #Start Postgres Database with Postgis installed
    services:
      test_phenobase:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_phenobase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d test_phenobase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - name: Init databases
        run: |
          cid=$(docker ps -qf name=test_phenobase)
          docker exec "$cid" psql -U user -d postgres -c "CREATE DATABASE phenobase;"
          docker exec "$cid" psql -U user -d test_phenobase -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          docker exec "$cid" psql -U user -d phenobase -c "CREATE EXTENSION IF NOT EXISTS postgis;"

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: 035_phenobase
          cache-environment: true

      # static type checking
      - name: mypy
        run: mypy .

      # lint + complexity + security (replaces pylint, bandit, radon cc)
      - name: ruff check
        run: ruff check

      # formatting check (replaces autopep8)
      - name: ruff format
        run: ruff format --check
      
      # Load minimal env vars for pytest to run (only test credentatial)
      - name: Get Env Vars
        run: |
          cp .env.template .env

      # Test Coverage excluding  test that only run on FOLA infrastructure
      - name: pytest with coverage
        run: pytest --cov=src/ --cov-fail-under=80 -m "not ags_fola"
